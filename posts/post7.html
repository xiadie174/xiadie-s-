<h1>Bugku Web｜GET Writeup</h1>
<h2>题目描述</h2>
<p>GET类型Web题，提示flag{}。</p >
<h2>解题思路</h2>
<p>本题考察GET传参。GET参数写在URL的?后面，服务端读取URL参数判断。</p >
<h2>操作步骤</h2>
<ol>
<li>访问原始链接</li>
<li>URL末尾拼接参数：<code>?what=flag</code></li>
<li>完整地址：http://160.202.254.160:19221?what=flag</li>
<li>访问得到flag</li>
</ol>
<h2>知识点</h2>
<p>GET请求：参数附加在URL之后，使用?分隔URL和参数，多个参数用&分隔。</p >
