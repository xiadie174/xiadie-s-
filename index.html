---
layout: default
---
<div class="post-list">
    {% for post in site.posts %}
    <article class="post-item">
        <h2 class="post-title">
            <a href=" ">{{ post.title }}</a >
        </h2>
        <p class="post-date">{{ post.date | date: "%Y-%m-%d" }}</p >
    </article>
    {% endfor %}
</div>
